<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>文字の生態系文明</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --紙:#f2ece0;--墨:#0f0c07;--金:#8b6f47;--藍:#141a29;
  --朱:#c84b2f;--緑:#2d7a4a;
  --ui-bg:rgba(242,236,224,0.95);--bd:rgba(139,111,71,0.25);
}
html,body{width:100%;height:100%;overflow:hidden;
  font-family:'Hiragino Mincho ProN','Yu Mincho','MS Mincho',Georgia,serif;
  background:var(--紙);touch-action:none;-webkit-tap-highlight-color:transparent}
#世界{display:flex;flex-direction:column;width:100%;height:100%;height:100dvh}
#上部{flex:0 0 auto;padding:10px 14px 8px;background:var(--ui-bg);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--bd);z-index:20;
  transition:background .8s,border-color .8s}
#題字行{display:flex;align-items:center;gap:8px;margin-bottom:7px}
#題字{font-size:16px;font-weight:700;letter-spacing:.12em;color:var(--墨)}
#文明バッジ{font-size:10px;padding:2px 8px;border-radius:20px;
  background:rgba(139,111,71,.1);color:var(--金);border:1px solid var(--bd);
  letter-spacing:.06em;transition:all .4s}
#入力行{display:flex;gap:8px;align-items:center;margin-bottom:7px}
#入力欄{flex:1;padding:9px 12px;border:1.5px solid var(--bd);border-radius:8px;
  background:rgba(255,255,255,.5);font-family:inherit;font-size:16px;
  color:var(--墨);outline:none;transition:border-color .2s}
#入力欄:focus{border-color:var(--金);background:rgba(255,255,255,.9)}
#ボタン行{display:flex;gap:8px}
.btn{flex:1;padding:9px 0;border:1.5px solid var(--bd);border-radius:8px;
  background:rgba(255,255,255,.4);font-family:inherit;font-size:13px;
  color:var(--墨);cursor:pointer;letter-spacing:.06em;transition:all .15s;
  -webkit-tap-highlight-color:transparent}
.btn:active{background:var(--金);color:#fff;transform:scale(.97)}
#地図層{flex:1 1 auto;position:relative;overflow:hidden;min-height:0}
canvas{display:block;width:100%;height:100%}
#下部{flex:0 0 auto;padding:8px 14px;background:var(--ui-bg);
  backdrop-filter:blur(12px);border-top:1px solid var(--bd);z-index:20;
  cursor:pointer;transition:background .8s;user-select:none;min-height:42px}
#状態行{display:flex;justify-content:space-between;align-items:center;gap:8px}
#状態文{font-size:11px;opacity:.7;letter-spacing:.06em;flex:1;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#人口表示{font-size:13px;font-weight:700;color:var(--金);
  white-space:nowrap;min-width:72px;text-align:right;transition:color .3s}
#人口表示.増加{color:#2d7a4a!important}
#人口表示.減少{color:#c84b2f!important}
body.夜{--ui-bg:rgba(14,20,38,.95);--bd:rgba(80,120,200,.2)}
body.夜 #題字,body.夜 #状態文,body.夜 .btn,body.夜 #入力欄{color:#b8ccee}
body.夜 #入力欄{background:rgba(20,30,55,.6);border-color:rgba(80,120,200,.25)}
body.夜 .btn{background:rgba(20,30,55,.5);border-color:rgba(80,120,200,.2)}
body.夜 #文明バッジ{background:rgba(80,120,200,.15);color:#8ab4e8;border-color:rgba(80,120,200,.22)}
body.夕{--ui-bg:rgba(200,130,90,.92);--bd:rgba(180,90,50,.3)}
#TL幕{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;
  flex-direction:column;justify-content:center;align-items:center;
  color:#f2ece0;gap:14px;text-align:center;padding:24px}
#TL幕.on{display:flex}
#TL幕 .大{font-size:36px}
#TL幕 .本{font-size:14px;letter-spacing:.1em;line-height:1.7}
#TL幕 .小{font-size:11px;opacity:.6}
#砂嵐幕{display:none;position:fixed;inset:0;z-index:300;pointer-events:all}
#砂嵐幕.on{display:block}
#砂嵐Canvas{position:absolute;inset:0;width:100%;height:100%}
#文字舞台{position:absolute;inset:0;pointer-events:none}
#フェードメッセージ{
  position:absolute;inset:0;display:flex;flex-direction:column;
  justify-content:center;align-items:center;gap:20px;
  pointer-events:none;opacity:0;transition:opacity 1.2s
}
#フェードメッセージ .行{
  font-size:clamp(18px,5vw,28px);letter-spacing:.18em;
  color:rgba(242,236,220,0);font-family:'Hiragino Mincho ProN','Yu Mincho','MS Mincho',Georgia,serif;
  text-shadow:0 0 20px rgba(200,180,140,.8);
  transition:color 1.5s,text-shadow 1.5s;
}
#フェードメッセージ .行.見える{color:rgba(242,236,220,.95);}
#最終画面{
  display:none;position:fixed;inset:0;z-index:400;
  background:radial-gradient(ellipse at 50% 60%, #0a0e1a 0%, #050810 100%);
  flex-direction:column;justify-content:center;align-items:center;
  gap:18px;text-align:center;padding:32px;
  font-family:'Hiragino Mincho ProN','Yu Mincho','MS Mincho',Georgia,serif;
  color:#d4c9b0;
}
#最終画面.on{display:flex}
#最終画面 .装飾線{
  width:clamp(80px,40%,180px);height:1px;
  background:linear-gradient(90deg,transparent,rgba(180,150,90,.6),transparent)
}
#最終画面 .副題{font-size:11px;letter-spacing:.3em;color:rgba(180,150,90,.7);margin-bottom:4px}
#最終画面 .主題{
  font-size:clamp(22px,6vw,34px);letter-spacing:.22em;
  background:linear-gradient(135deg,#c8b060,#e8d898,#c8b060);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;line-height:1.4;margin:4px 0 16px;
}
#最終画面 .本文{font-size:clamp(12px,3.5vw,15px);line-height:2;letter-spacing:.1em;
  color:rgba(210,200,180,.85);max-width:360px}
#最終画面 .署名{font-size:clamp(16px,4.5vw,22px);letter-spacing:.2em;
  color:#d4c9b0;margin-top:8px;font-style:italic}
#戻るボタン{
  margin-top:16px;padding:12px 36px;
  border:1px solid rgba(180,150,90,.5);border-radius:4px;
  background:rgba(180,150,90,.08);
  color:rgba(210,200,180,.9);font-family:inherit;font-size:13px;
  letter-spacing:.15em;cursor:pointer;transition:all .3s;
}
#戻るボタン:active,#戻るボタン:hover{
  background:rgba(180,150,90,.18);border-color:rgba(200,170,110,.7);
  color:#e8d898;
}
</style>
</head>
<body>
<div id="世界">
  <div id="上部">
    <div id="題字行">
      <div id="題字">文字の生態系</div>
      <div id="文明バッジ">原始の地</div>
    </div>
    <div id="入力行">
      <input id="入力欄" type="text" placeholder="言葉を授けよ…"
        autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false">
    </div>
    <div id="ボタン行">
      <button class="btn" id="命ボタン">✦ 命を吹き込む</button>
      <button class="btn" id="リresetボタン">◌ リセット</button>
    </div>
  </div>
  <div id="地図層"><canvas id="舞台"></canvas></div>
  <div id="下部">
    <div id="状態行">
      <div id="状態文">住民たちが静かに息をしている…</div>
      <div id="人口表示">住民 0 人</div>
    </div>
  </div>
</div>
<div id="TL幕">
  <div class="大">⏳</div>
  <div class="本">あなたが留守にしていた間に、<br>激動の歴史が流れたようです…</div>
  <div class="小" id="TL詳細"></div>
</div>
<div id="砂嵐幕">
  <canvas id="砂嵐Canvas"></canvas>
  <canvas id="文字舞台"></canvas>
  <div id="フェードメッセージ">
    <div class="行" id="msg1">ずっと見ていたよ</div>
    <div class="行" id="msg2">ありがとう</div>
    <div class="行" id="msg3">私たちは君が作った</div>
  </div>
</div>
<div id="最終画面">
  <div class="装飾線"></div>
  <div style="height:4px"></div>
  <div class="副題">── 隠しエンディング ──</div>
  <div class="主題">創造主の記録</div>
  <div class="装飾線"></div>
  <div class="本文">
    あなたは文字たちの世界に<br>命を吹き込んだ創造主です。<br><br>
    その記録は、永遠に<br>この世界に刻まれました。
  </div>
  <div class="署名">ありがとう。</div>
  <button id="戻るボタン">世界へ戻る</button>
</div>
<script>

let 繁殖タイマー = 0; let 狩りタイマー = 0; let 状態タイマー = 0;

let エンディング発動済み = false;
let 隠しコマンド待機中  = false;
let 隠しコマンドタイマー = null;

let AC = null; let マスターゲイン = null;
let 砂嵐ノイズ節点 = null; let 砂嵐ゲイン節点 = null;
let 生成音カウンター = 0;
function AC初期化() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    マスターゲイン = AC.createGain(); マスターゲイン.gain.value = 0.55;
    マスターゲイン.connect(AC.destination);
  } catch(e) { AC = null; }
}

  if (!AC || AC.state !== 'running') return;
  生成音カウンター++; if (生成音カウンター > 6) { 生成音カウンター--; return; }

  const osc = AC.createOscillator(); const gain = AC.createGain();
  const vol = Math.max(0.04, 0.18 / Math.sqrt(生成音カウンター));

  if (!AC || AC.state !== 'running') return; 砂嵐音停止();

function 初回起動日取得() { try { let d = localStorage.getItem('文字生態系_初回'); if (!d) { d = Date.now().toString(); localStorage.setItem('文字生態系_初回', d); } return parseInt(d, 10); } catch(e) { return Date.now(); } }
function 通常エンディング条件チェック() { if (エンディング発動済み) return false; const 人口 = 住民リスト.filter(h => !h.消滅フラグ).length; if (人口 < 777) return false; const h = new Date().getHours(); if (h < 0 || h >= 3) return false; const 経過日 = (Date.now() - 初回起動日取得()) / (1000 * 60 * 60 * 24); if (経過日 < 7) return false; if (Math.random() > 1/1000) return false; return true; }
function エンディング発動() {
  if (エンディング発動済み) return; エンディング発動済み = true;
  try { localStorage.setItem('文字生態系_ED', '1'); } catch(e) {}

  const $幕 = document.getElementById('砂嵐幕'); $幕.classList.add('on'); AC初期化(); 砂嵐音開始();
  const 砂嵐C = document.getElementById('砂嵐Canvas'); const 文字C = document.getElementById('文字舞台');
  砂嵐C.width = 文字C.width = window.innerWidth; 砂嵐C.height = 文字C.height = window.innerHeight;
  const 砂嵐ctx = 砂嵐C.getContext('2d'); const 文字ctx = 文字C.getContext('2d'); const W = 砂嵐C.width, H = 砂嵐C.height;

  const 文字粒子 = 元文字.map((c, i) => ({ 文字: c, x: 80 + Math.random() * (W - 160), y: 80 + Math.random() * (H - 160), 目標x: 0, 目標y: 0, vx: 0, vy: 0, アルファ: 0, フェーズ: 'scatter' }));
  const フォントSz = Math.min(Math.floor(W / 12), 28); const 行高 = フォントSz * 2.2; const 全行y = [H/2 - 行高, H/2, H/2 + 行高];
  function 最終位置計算() { let idx = 0; 最終文.forEach((行, li) => { const 文字群 = [...行]; const 全幅 = 文字群.length * フォントSz * 1.3; 文字群.forEach((c, ci) => { if (idx < 文字粒子.length) { 文字粒子[idx].目標x = W/2 - 全幅/2 + ci * フォントSz * 1.3 + フォントSz * 0.65; 文字粒子[idx].目標y = 全行y[li]; 文字粒子[idx].文字 = c; idx++; } }); }); }
  最終位置計算(); let 前時 = performance.now(); let 文字フェーズ = 'scatter'; let フェーズ開始 = performance.now(); let フェードRAF;
  function 文字ループ(now) {
    フェードRAF = requestAnimationFrame(文字ループ); const 経過 = now - フェーズ開始;
    文字ctx.clearRect(0, 0, W, H); 文字ctx.font = `${フォントSz}px 'Hiragino Mincho ProN','Yu Mincho',serif`; 文字ctx.textAlign = 'center'; 文字ctx.textBaseline = 'middle';
    if (文字フェーズ === 'scatter') {
      文字粒子.forEach((p, i) => { p.アルファ = Math.min(1, 経過 / 2500 * (0.5 + Math.random() * 0.5)); p.x += (Math.random() - 0.5) * 0.4; p.y += (Math.random() - 0.5) * 0.4; 文字ctx.save(); 文字ctx.globalAlpha = p.アルファ * 0.85; 文字ctx.fillStyle = `rgba(220,200,160,${p.アルファ})`; 文字ctx.shadowColor = 'rgba(200,180,120,.5)'; 文字ctx.shadowBlur = 6; 文字ctx.fillText(p.文字, p.x, p.y); 文字ctx.restore(); });

function 足跡描画更新() { const 夜=昼夜モード()==='夜'; 足跡リスト=足跡リスト.filter(f=>{ f.齢++; const a=Math.max(0,1-f.齢/50); if(a<=0) return false; ctx.save(); ctx.globalAlpha=a*0.6; ctx.fillStyle=夜?'rgba(180,210,255,.8)':'rgba(100,80,50,.8)'; ctx.beginPath(); ctx.arc(f.x,f.y,1.2,0,Math.PI*2); ctx.fill(); ctx.restore(); return a>0; }); }
function エモート描画更新() { エモートリスト=エモートリスト.filter(e=>{ e.y+=e.vy; e.齢++; const a=Math.max(0,1-e.齢/70); if(a<=0) return false; ctx.save(); ctx.globalAlpha=a; ctx.font='11px serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(e.記号,e.x,e.y); ctx.restore(); return a>0; }); }
function 昇天描画更新() { 昇天リスト=昇天リスト.filter(e=>{ e.y-=0.9; e.齢++; e.アルファ=Math.max(0,1-e.齢/100); if(e.アルファ<=0) return false; ctx.save(); ctx.globalAlpha=e.アルファ; ctx.font=`${e.サイズ}px 'Hiragino Mincho ProN','Yu Mincho',serif`; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillStyle=`hsla(${e.色相},60%,65%,${e.アルファ})`; ctx.shadowColor=`hsl(${e.色防||e.色相},70%,75%)`; ctx.shadowBlur=8; ctx.fillText(e.文字,e.x,e.y); const 輪y=e.y-e.サイズ*0.85; ctx.strokeStyle=`rgba(255,220,80,${e.アルファ*0.9})`; ctx.lineWidth=1.5; ctx.shadowColor='rgba(255,220,80,.6)'; ctx.shadowBlur=6; ctx.beginPath(); ctx.ellipse(e.x,輪y,e.サイズ*0.5,e.サイズ*0.15,0,0,Math.PI*2); ctx.stroke(); ctx.restore(); return e.アルファ>0; }); }
function 人口増減描画更新() { 人口増減表示=人口増減表示.filter(p=>{ p.y+=p.vy; p.齢++; p.アルファ=Math.max(0,1-p.齢/55); if(p.アルファ<=0) return false; ctx.save(); ctx.globalAlpha=p.アルファ; ctx.font='bold 10px sans-serif'; ctx.textAlign='center'; ctx.fillStyle=p.色; ctx.shadowColor=p.色; ctx.shadowBlur=4; ctx.fillText(p.テキスト,p.x,p.y); ctx.restore(); return p.アルファ>0; }); }
